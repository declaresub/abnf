version: 2
updates:
  - package-ecosystem: uv
    # Files stored in repository root
    directory: "/"
    schedule:
      interval: daily
      time: "04:00"
      timezone: America/Kentucky/Monticello
    # Wait 7 days after a release before proposing it. Dodges the
    # window in which a freshly-published malicious version is live
    # but not yet caught/yanked.
    cooldown:
      default-days: 7
    # Batch routine dev-tooling bumps into a single PR with one
    # consistent uv.lock update. Merging many single-dependency PRs in
    # sequence otherwise drifts the lockfile: each PR is locked against
    # an older master, so a later "Update branch" merge can drop an
    # earlier PR's lock entries. Major bumps still come as individual
    # PRs so they get their own review (all these deps are dev/build
    # tooling; the published `abnf` package has no runtime dependencies).
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "04:00"
      timezone: America/Kentucky/Monticello
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: cargo
    # Rust workspace for the optional `abnf-rust` companion package.
    directory: "/packages/abnf-rust"
    schedule:
      interval: weekly
      time: "04:00"
      timezone: America/Kentucky/Monticello
    cooldown:
      default-days: 7
    ignore:
      # pyo3 makes breaking API changes on every minor (0.x.y).
      # Treat each pyo3 bump as a deliberate migration task; do not
      # auto-propose semver-minor or semver-major updates.
      - dependency-name: "pyo3"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
