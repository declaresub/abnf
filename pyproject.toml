[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=64",
    "setuptools_scm>=8",
]

[project]
authors = [
    { email = "charles@declaresub.com", name = "Charles Yeomans" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Interpreters",
]
description = "Parsers for ABNF grammars."
dynamic = [
    "version",
]
keywords = [
    "abnf",
    "generator",
    "parser",
]
name = "abnf"
readme = "README.md"
requires-python = ">= 3.10"

[project.urls]
Homepage = "https://github.com/declaresub/abnf"
Documentation = "https://abnf.readthedocs.io/"
Source = "https://github.com/declaresub/abnf"
Changelog = "https://github.com/declaresub/abnf/blob/master/CHANGELOG.md"
Issues = "https://github.com/declaresub/abnf/issues"


[project.optional-dependencies]
dev = [
'check-manifest==0.51',
'pre-commit==4.6.1',
'pyright[nodejs]==1.1.411',
'pytest==9.1.1',
'pytest-cov==7.1.0',
'pytest-benchmark==5.2.3',
'hypothesis==6.165.2',
'ruff==0.16.1',
'setuptools==83.0.0',
'tox==4.58.0',
'setuptools_scm==10.2.1',
]
# `pip install abnf[rust]` pulls in the companion `abnf-rust`
# distribution, which provides the compiled extension that
# `abnf.parser` routes its combinator primitives through.  The
# pure-Python `abnf` package on its own remains the default and a
# fully working fallback (also forced via the ABNF_NO_RUST=1
# environment variable when the extra is installed).
rust = [
    # Lock-stepped versioning: `abnf` and `abnf-rust` release under
    # the same git tag.  Lower bound matches the current minor; upper
    # bound clamps to the next major so a future `abnf-rust` release
    # with a breaking change can't silently come in via the extra.
    #
    # The floor can only name a version that is already on PyPI: the
    # release workflow resolves this dependency (via `uv export`, for
    # the SBOM) *before* publishing, so naming the version being
    # released makes the release unbuildable.  Raise it in the cycle
    # after the one that introduces the requirement, never in it.
    'abnf-rust>=2.7,<3',
]
# Documentation toolchain (Sphinx + MyST for Markdown prose + autodoc for the
# API reference from docstrings).  Kept separate from `dev` so running the test
# suite does not require the doc stack.  Pinned to versions that support the
# project's Python floor (3.10); Read the Docs installs `.[docs]`.
docs = [
    'sphinx==8.1.3',
    'myst-parser==4.0.1',
    'furo==2025.12.19',
    'sphinx-copybutton==0.5.2',
]

[tool.check-manifest]
ignore = [
    # The packages/abnf-rust subtree builds the companion `abnf-rust`
    # distribution and is intentionally excluded from the `abnf` sdist.
    "packages",
    "packages/**",
    "tests/notes",
    # Documentation sources are built by Read the Docs from the repo, not
    # shipped in the sdist.
    "docs",
    "docs/**",
    ".readthedocs.yaml",
]

[tool.pytest.ini_options]
norecursedirs = [".tox", "venv", ".hypothesis"]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.10"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "COM812",
    "E501",
    "RUF001",
    "S101",
]
select = [
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "COM",
    "DTZ",
    "E",
    "EM",
    "F",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "PERF",
    "RUF",
    "SIM",
    "T20",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
# gen_corpus.py is a developer CLI utility; print() is its output channel.
"tests/fuzz/gen_corpus.py" = ["T201"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.setuptools_scm]
